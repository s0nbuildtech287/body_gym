server:
  port: 8080

spring:
  application:
    name: bodygym-server
  datasource:
    url: jdbc:h2:mem:bodygymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

exercises:
  dataset:
    json-path: "../exercises-dataset/data/exercises.json"
    images-path: "../exercises-dataset/images"
    videos-path: "../exercises-dataset/videos"
